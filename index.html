<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324D">
  <title>MEEP · Iniciar sesión</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263238;background:#e8e9e1;--navy:#17324d;--teal:#2a9d8f;--line:#dde2dc;--muted:#55656d;--red:#a32020}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);overflow:hidden;background:#f7f7f2;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 40px #17324d20}
    header{padding:28px 22px;text-align:center;background:var(--navy);color:white}header strong{letter-spacing:.18em}h1{font-size:27px;margin:9px 0 2px}header p{margin:0;opacity:.82}main{padding:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button,button,input{font:inherit}.tabs button{padding:11px;border:0;border-radius:12px;background:white;color:var(--muted);font-weight:750;cursor:pointer}.tabs button[aria-selected=true]{background:#e0f1ef;color:var(--navy)}form{display:grid;gap:13px}label{display:grid;gap:6px;font-size:14px;font-weight:750}input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:white}input:focus{outline:3px solid #2a9d8f55;border-color:var(--teal)}.primary{min-height:50px;border:0;border-radius:13px;background:var(--navy);color:white;font-weight:800;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.error,.notice{display:none;margin:0 0 13px;padding:11px 12px;border-radius:11px;font-size:14px}.error.show{display:block;color:var(--red);background:#fae8e8}.notice.show{display:block;color:var(--navy);background:#e0f1ef}.hint{margin:16px 0 0;color:var(--muted);font-size:13px;text-align:center} [hidden]{display:none!important}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section class="card" aria-label="Acceso a MEEP">
    <header><strong>MEEP</strong><h1 id="title">Iniciar sesión</h1><p id="subtitle">Accede a tu medidor de pH</p></header>
    <main>
      <div class="tabs" role="tablist" aria-label="Opciones de acceso">
        <button id="loginTab" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
        <button id="registerTab" type="button" role="tab" aria-selected="false">Crear cuenta</button>
      </div>
      <p class="error" id="error" role="alert"></p><p class="notice" id="notice" role="status"></p>
      <form id="authForm">
        <label id="nameField" hidden>Nombre<input id="name" autocomplete="name" maxlength="80"></label>
        <label>Correo electrónico<input id="email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="primary" id="submit" type="submit">Ingresar</button>
      </form>
      <p class="hint">Tu cuenta se autentica con Supabase. Si es tu primer acceso, crea una cuenta.</p>
    </main>
  </section>
  <script>
    // La publishable key es pública por diseño. La seguridad depende de Auth y las políticas RLS.
    const SUPABASE_URL = 'https://zllblgptrobzpxfoksvb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_w9drjwojGLrBmIyXd7d4vA_4wfqU40I';
    const APP_URL = './Aplicaci%C3%B3n%20Meep.html';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    let mode = 'login';
    const $ = id => document.getElementById(id);
    function message(kind, text) { $('error').classList.remove('show'); $('notice').classList.remove('show'); $(kind).textContent = text; $(kind).classList.add('show'); }
    function setMode(next) {
      mode = next;
      $('error').classList.remove('show'); $('notice').classList.remove('show');
      const registering = mode === 'register';
      $('loginTab').setAttribute('aria-selected', String(!registering));
      $('registerTab').setAttribute('aria-selected', String(registering));
      $('title').textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
      $('subtitle').textContent = registering ? 'Regístrate para acceder a MEEP' : 'Accede a tu medidor de pH';
      $('nameField').hidden = !registering;
      $('name').required = registering;
      $('password').autocomplete = registering ? 'new-password' : 'current-password';
      $('submit').textContent = registering ? 'Crear cuenta' : 'Ingresar';
    }
    $('loginTab').addEventListener('click', () => setMode('login'));
    $('registerTab').addEventListener('click', () => setMode('register'));
    $('authForm').addEventListener('submit', async event => {
      event.preventDefault();
      $('error').classList.remove('show'); $('notice').classList.remove('show');
      const button = $('submit'); button.disabled = true;
      const email = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      let result;
      try {
        if (mode === 'register') {
          result = await supabase.auth.signUp({ email, password, options: { data: { name: $('name').value.trim() } } });
          if (!result.error && result.data.session) { location.replace(APP_URL); return; }
          if (!result.error) { message('notice', 'Cuenta creada. Revisa tu correo para confirmar la dirección y luego inicia sesión.'); return; }
        } else {
          result = await supabase.auth.signInWithPassword({ email, password });
          if (!result.error) { location.replace(APP_URL); return; }
        }
        message('error', result.error?.message || 'No se pudo completar el acceso.');
      } catch (error) {
        message('error', 'No se pudo conectar con Supabase. Verifica tu conexión y vuelve a intentarlo.');
      } finally { button.disabled = false; }
    });
    supabase.auth.getSession().then(({ data, error }) => {
      if (!error && data.session) location.replace(APP_URL);
    }).catch(() => {});
  </script>
</body>
</html>
