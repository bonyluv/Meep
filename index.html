<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324D">
  <title>Iniciar sesión · MEEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"Nunito Sans",system-ui,sans-serif;color:#263238;background:#e8e9e1;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
    .panel{width:min(100%,420px);background:#f7f7f2;border:1px solid #e1e3da;border-radius:28px;padding:32px;box-shadow:0 18px 55px #17324d1c}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:#17324d}
    .mark{width:48px;height:48px;border-radius:15px;background:#2a9d8f;display:grid;place-items:center;color:#fff;font:700 22px "Sora",sans-serif}
    .brand-name{font:700 22px "Sora",sans-serif;letter-spacing:.13em}
    .brand-sub{display:block;font-size:12px;letter-spacing:0;font-weight:600;color:#55656d}
    h1{font:700 26px/1.2 "Sora",sans-serif;color:#17324d;margin:0 0 8px}
    .intro{color:#55656d;margin:0 0 24px}
    label{display:block;font-weight:800;font-size:14px;margin:16px 0 6px}
    input{width:100%;height:50px;border:1px solid #cbd1ce;border-radius:12px;padding:0 14px;background:#fff;color:#263238;font:inherit}
    input:focus{outline:3px solid #2a9d8f55;border-color:#2a9d8f}
    .submit{width:100%;min-height:54px;margin-top:22px;border:0;border-radius:14px;background:#17324d;color:#fff;font:800 16px inherit;cursor:pointer}
    .submit:hover{background:#214765}
    .switch{margin:20px 0 0;text-align:center;color:#55656d}
    .switch button,.guest{color:#187d73;text-decoration:underline;font:800 15px inherit;background:none;border:0;cursor:pointer}
    .guest{display:block;margin:20px auto 0;font-size:14px}
    .notice{margin-top:16px;padding:11px 13px;border-radius:12px;background:#fdeedf;border:1px solid #f4a261;color:#263238;font-size:14px}
    [hidden]{display:none!important}
    @media(max-width:420px){body{padding:14px}.panel{padding:25px 21px;border-radius:23px}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand" aria-label="MEEP">
      <span class="mark" aria-hidden="true">M</span>
      <span><span class="brand-name">MEEP</span><span class="brand-sub">Medidor de pH de alimentos</span></span>
    </div>
    <h1 id="heading">Inicia sesión</h1>
    <p class="intro" id="intro">Accede a tu cuenta para continuar.</p>
    <form id="auth-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required minlength="6">
      <button class="submit" id="submit" type="submit">Iniciar sesión</button>
    </form>
    <p class="switch"><span id="switch-text">¿No tienes una cuenta?</span> <button type="button" id="switch-mode">Regístrate</button></p>
    <div class="notice" id="notice" role="status" hidden>La pantalla de acceso está lista, pero la autenticación aún no está conectada a un servidor. No ingreses una contraseña real.</div>
    <a class="guest" href="./Aplicaci%C3%B3n%20Meep.html">Continuar sin iniciar sesión</a>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const notice = document.getElementById('notice');
    const heading = document.getElementById('heading');
    const intro = document.getElementById('intro');
    const submit = document.getElementById('submit');
    const switchText = document.getElementById('switch-text');
    const switchMode = document.getElementById('switch-mode');
    const password = document.getElementById('password');
    let registering = false;

    switchMode.addEventListener('click', () => {
      registering = !registering;
      heading.textContent = registering ? 'Crear cuenta' : 'Inicia sesión';
      intro.textContent = registering ? 'Regístrate para comenzar a usar MEEP.' : 'Accede a tu cuenta para continuar.';
      submit.textContent = registering ? 'Crear cuenta' : 'Iniciar sesión';
      switchText.textContent = registering ? '¿Ya tienes una cuenta?' : '¿No tienes una cuenta?';
      switchMode.textContent = registering ? 'Inicia sesión' : 'Regístrate';
      password.autocomplete = registering ? 'new-password' : 'current-password';
      notice.hidden = true;
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      notice.hidden = false;
    });
  </script>
</body>
</html>
