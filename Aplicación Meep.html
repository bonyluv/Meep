<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MEEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Concepto: app móvil de una columna con cabecera azul petróleo, contenido en tarjetas y barra inferior de tres secciones.
   Diseño único en tema claro (paleta de marca obligatoria). */
:root {
  --verde: #2E7D32;
  --teal: #2A9D8F;
  --petroleo: #17324D;
  --fondo: #F7F7F2;
  --rojo: #C62828;
  --ambar: #F4A261;
  --texto: #263238;
  --muted: #55656D;
  --linea: #E1E3DA;
  --tarjeta: #FFFFFF;
  --neutro: #E9ECEE;
  --verde-tint: #E5F0E6;
  --rojo-tint: #FAE8E8;
  --ambar-tint: #FDEEDF;
  --teal-tint: #E0F1EF;
  --exterior: #E8E9E1;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--exterior);
  color: var(--texto);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  margin: 0;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

#app {
  max-width: 460px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column;
  background: var(--fondo);
  box-shadow: 0 0 0 1px var(--linea);
  position: relative; overflow: hidden;
}
.topbar {
  background: var(--petroleo); color: #fff;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; min-height: 60px; flex: none;
}
.topbar .back { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.topbar .titulo { font-family: var(--display); font-weight: 600; font-size: 18px; flex: 1; min-width: 0; }
.logo { display: flex; align-items: center; gap: 10px; flex: 1; }
.logo b { font-family: var(--display); font-size: 22px; letter-spacing: .14em; font-weight: 700; }
.logo .sub { font-size: 12px; opacity: .8; letter-spacing: 0; display: block; font-weight: 600; }
.chip-demo { background: var(--ambar); color: var(--texto); font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 99px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

main { flex: 1; overflow-y: auto; padding: 18px 16px 24px; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.nav {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--tarjeta); border-top: 1px solid var(--linea);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px; color: var(--muted); font-weight: 700; font-size: 13px; }
.nav button[aria-current="page"] { color: var(--petroleo); background: var(--teal-tint); }
.nav button[aria-current="page"] svg { color: var(--teal); }

h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; color: var(--petroleo); }
h2 { font-size: 20px; font-weight: 600; color: var(--petroleo); }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 20px; padding: 16px; }
.card.pad-lg { padding: 20px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 56px; padding: 14px 18px; border-radius: 16px;
  font-weight: 800; font-size: 17px; text-align: center;
}
.btn.primario { background: var(--petroleo); color: #fff; }
.btn.secundario { background: var(--teal); color: #fff; }
.btn.borde { background: var(--tarjeta); color: var(--petroleo); border: 2px solid var(--petroleo); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.chico { min-height: 44px; font-size: 15px; padding: 8px 14px; border-radius: 12px; }

.estado { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; font-weight: 800; font-size: 14px; }
.estado.off { background: var(--neutro); color: var(--texto); }
.estado.on { background: var(--teal-tint); color: #17324D; }
.estado.err { background: var(--rojo-tint); color: var(--rojo); }
.estado.wait { background: var(--ambar-tint); color: var(--texto); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

.hero-home { display: flex; flex-direction: column; gap: 8px; padding: 6px 2px 2px; }
.hero-home .tag { color: var(--teal); font-weight: 800; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; }
.sonda { display: grid; place-items: center; padding: 8px 0; }

.nota { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: 14px; background: var(--ambar-tint); border: 1px solid var(--ambar); }
.nota svg { flex: none; margin-top: 1px; }
.nota.sutil { background: var(--tarjeta); border-color: var(--linea); color: var(--muted); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.food {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  background: var(--tarjeta); border: 2px solid var(--linea); border-radius: 20px; padding: 16px 8px 12px; min-height: 140px;
}
.food[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-tint); }
.food .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--fondo); display: grid; place-items: center; color: var(--petroleo); }
.food[aria-pressed="true"] .ico { background: #fff; color: var(--teal); }
.food b { font-family: var(--display); font-size: 16px; font-weight: 600; }
.food .badge-sel { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: none; place-items: center; }
.food[aria-pressed="true"] .badge-sel { display: grid; }
.mini { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--neutro); color: var(--muted); }
.mini.amb { background: var(--ambar-tint); color: var(--texto); border: 1px solid var(--ambar); }

.lectura { display: grid; place-items: center; padding: 18px 0 6px; }
.ondas { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
.ondas i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--teal); opacity: 0; animation: onda 2s ease-out infinite; }
.ondas i:nth-child(2) { animation-delay: .65s; }
.ondas i:nth-child(3) { animation-delay: 1.3s; }
.ondas .centro { width: 84px; height: 84px; border-radius: 50%; background: var(--petroleo); color: #fff; display: grid; place-items: center; z-index: 1; }
@keyframes onda { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ondas i { animation: none; opacity: .35; } .ondas i:nth-child(2) { transform: scale(.8); } .ondas i:nth-child(3) { transform: scale(.65); } }

.escenarios { display: flex; flex-wrap: wrap; gap: 8px; }
.escenarios button { padding: 9px 12px; border-radius: 12px; border: 2px solid var(--linea); background: var(--tarjeta); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.escenarios button[aria-pressed="true"] { border-color: var(--petroleo); background: var(--petroleo); color: #fff; }

/* Resultado */
.res-hero { border-radius: 24px; padding: 22px 20px; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.res-hero.in { background: var(--verde); }
.res-hero.out { background: var(--rojo); }
.res-hero.na { background: var(--neutro); color: var(--texto); border: 1px solid var(--linea); }
.res-hero .icono { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #fff; }
.res-hero.in .icono { color: var(--verde); }
.res-hero.out .icono { color: var(--rojo); }
.res-hero.na .icono { color: var(--petroleo); }
.res-hero .estado-txt { font-family: var(--display); font-weight: 600; font-size: 18px; }
.res-hero .ph-val { font-family: var(--display); font-weight: 700; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; }
.res-hero .ph-val small { font-size: 20px; font-weight: 600; opacity: .85; }
.res-hero .alimento { font-weight: 800; font-size: 16px; opacity: .95; }
.res-hero .expl { font-size: 15px; max-width: 34ch; }

.filas { display: flex; flex-direction: column; }
.fila { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.fila:last-child { border-bottom: 0; }
.fila span:first-child { color: var(--muted); font-weight: 600; }
.fila span:last-child { font-weight: 800; text-align: right; min-width: 0; }

/* Historial */
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 18px; padding: 12px 14px; }
.item .barra { width: 6px; align-self: stretch; border-radius: 4px; flex: none; }
.item.in .barra { background: var(--verde); } .item.out .barra { background: var(--rojo); } .item.na .barra { background: #9AA5AB; }
.item .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .cuerpo b { font-family: var(--display); font-weight: 600; }
.item .ph { font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.item.in .ph { color: var(--verde); } .item.out .ph { color: var(--rojo); } .item.na .ph { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; }
.pill.in { color: var(--verde); } .pill.out { color: var(--rojo); } .pill.na { color: var(--muted); }
.vacio { text-align: center; padding: 28px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vacio .circ { width: 84px; height: 84px; border-radius: 50%; background: var(--teal-tint); color: var(--teal); display: grid; place-items: center; }

/* Ayuda */
details { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 18px; }
summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 800; cursor: pointer; border-radius: 18px; }
summary::-webkit-details-marker { display: none; }
summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
details[open] summary .chev { transform: rotate(90deg); }
summary .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--teal-tint); color: var(--teal); display: grid; place-items: center; flex: none; }
.det-body { padding: 0 16px 16px; }
ol.pasos { margin: 0; padding: 0; list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 10px; }
ol.pasos li { counter-increment: p; display: flex; gap: 12px; align-items: flex-start; }
ol.pasos li::before { content: counter(p); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--petroleo); color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center; margin-top: 1px; }
.leyenda { display: flex; flex-direction: column; gap: 10px; }
.leyenda div { display: flex; gap: 10px; align-items: flex-start; }

.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; border-top-color: transparent; animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

.toast { position: absolute; left: 16px; right: 16px; bottom: 88px; background: var(--petroleo); color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 700; text-align: center; z-index: 5; }
.fila-botones { display: flex; flex-direction: column; gap: 10px; }
.link { color: var(--teal); font-weight: 800; text-decoration: underline; padding: 6px 0; }
</style>

<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
  <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script>
/* =====================================================================
   NÚCLEO MEEP (sin interfaz): rangos, interpretación y adaptadores de dispositivo
   ===================================================================== */
const MeepCore = (() => {
  // IMPORTANTE: ningún rango está validado experimentalmente.
  // `rango: null` significa que el alimento aún no tiene referencia definida.
  // Los valores presentes son referencias PROVISIONALES para demostración y deben
  // reemplazarse por los rangos que MEEP valide en laboratorio.
  const ALIMENTOS = {
    leche:      { nombre: 'Leche',      icono: 'leche',     rango: { min: 6.6, max: 6.8 }, validado: false },
    queso:      { nombre: 'Queso',      icono: 'queso',     rango: { min: 5.2, max: 5.4 }, validado: false },
    yogur:      { nombre: 'Yogur',      icono: 'yogur',     rango: { min: 4.0, max: 4.5 }, validado: false },
  };

  const fmt = n => Number(n).toFixed(2).replace('.', ',');
  const fmtRango = r => r ? `${fmt(r.min)} – ${fmt(r.max)}` : null;

  // Devuelve { estado: 'in' | 'out' | 'na', motivo }
  function interpretar(clave, ph) {
    const a = ALIMENTOS[clave];
    if (ph === null || ph === undefined || !Number.isFinite(ph) || ph < 0 || ph > 14)
      return { estado: 'na', motivo: 'La lectura llegó incompleta o fuera de la escala de pH (0 a 14).' };
    if (!a || !a.rango)
      return { estado: 'na', motivo: 'Este alimento aún no tiene un rango de referencia definido y validado, por eso no se puede interpretar.' };
    return { estado: (ph >= a.rango.min && ph <= a.rango.max) ? 'in' : 'out', motivo: '' };
  }

  // Adaptador de dispositivo. Contrato: connect(): Promise<void>, read(clave, opciones): Promise<{ph, motivo?}>
  // BluetoothDevice es el punto de integración para el hardware real (aún no implementado).
  const BluetoothDevice = {
    nombre: 'MEEP (Bluetooth)',
    demo: false,
    async connect() {
      // Etapa posterior: navigator.bluetooth.requestDevice(...) con el servicio GATT definido para MEEP.
      // Solo se pedirían permisos aquí, cuando la persona pulsa "Conectar MEEP".
      throw new Error('bluetooth-no-implementado');
    },
    async read() { throw new Error('bluetooth-no-implementado'); }
  };

  // Dispositivo simulado: todas las lecturas son ficticias.
  const DemoDevice = {
    nombre: 'Modo demostración',
    demo: true,
    async connect() { return; },
    async read(clave, { escenario = 'in' } = {}) {
      const r = ALIMENTOS[clave].rango;
      const jitter = (Math.random() - 0.5);
      if (escenario === 'na') return { ph: null, motivo: 'Lectura incompleta: la sonda no tuvo contacto suficiente con la muestra.' };
      if (escenario === 'out') return { ph: r ? +(r.max + 0.5 + Math.random() * 0.4).toFixed(2) : 5.2 };
      return { ph: r ? +(((r.min + r.max) / 2) + jitter * (r.max - r.min) * 0.5).toFixed(2) : 6.5 };
    }
  };

  return { ALIMENTOS, interpretar, fmt, fmtRango, BluetoothDevice, DemoDevice };
})();

/* =====================================================================
   INTERFAZ
   ===================================================================== */
const ICON = {
  check: '<circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3L16.5 9"/>',
  warn: '<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.1"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7"/><path d="M12 17v.1"/>',
  bt: '<path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  leche: '<path d="M8.5 3h7l1.5 4v14H7V7z"/><path d="M7 11h10"/>',
  queso: '<path d="M3 18v-7l17-6v8z"/><path d="M3 18h17"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="11" r="1"/>',
  yogur: '<path d="M5 7h14l-2 14H7z"/><path d="M4 7h16"/><path d="M8 3.5h8"/>',
  sonda: '<path d="M12 3C9.5 7.5 6.5 10.5 6.5 14.5a5.5 5.5 0 0 0 11 0C17.5 10.5 14.5 7.5 12 3z"/><path d="M12 14.5v5"/>',
  trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.8v.1"/>',
  flask: '<path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/>',
  plug: '<path d="M9 3v5"/><path d="M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  broom: '<path d="M14 3l7 7"/><path d="M13 8l-9 9 3 3 9-9"/><path d="M7 14l3 3"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.1M4 12h.1M4 18h.1"/>'
};
function ic(name, size = 24, extra = '') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[name] || ''}</svg>`;
}
function logoSvg(size = 34) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#2A9D8F"/><path d="M20 7C16.5 13 12.5 16.5 12.5 21.5a7.5 7.5 0 0 0 15 0C27.5 16.5 23.5 13 20 7z" fill="#F7F7F2"/><path d="M20 21v8" stroke="#17324D" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="21" r="2" fill="#17324D"/></svg>`;
}

const ESTADO_TXT = { in: 'pH dentro del rango esperado', out: 'pH fuera del rango esperado', na: 'No se pudo interpretar la medición' };
const ESTADO_CORTO = { in: 'Dentro del rango', out: 'Fuera del rango', na: 'No interpretable' };
const ESTADO_EXPL = {
  in: 'La lectura se encuentra dentro del rango de referencia para este alimento.',
  out: 'La lectura está fuera del rango de referencia. Revisa las condiciones de conservación y sigue los procedimientos de seguridad alimentaria.',
  na: ''
};
const ESTADO_ICON = { in: 'check', out: 'warn', na: 'help' };
const NOTA_PH = 'Una medición de pH dentro del rango esperado no garantiza que el alimento esté libre de microorganismos patógenos o toxinas.';

const S = {
  view: 'home',            // home | food | measure | result | history | detail | help
  conexion: 'off',         // off | connecting | error | demo
  food: null,
  fase: 'idle',            // idle | reading | error
  errorMedicion: '',
  escenario: 'in',
  resultado: null,
  guardado: false,
  detalleId: null,
  registros: []
};
const LS_KEY = 'meep.historial.v1';
function cargar() {
  // Historial guardado localmente en este navegador/dispositivo.
  // En la primera visita se cargan ejemplos ficticios, claramente identificados.
  const ejemplosIniciales = () => {
    const ahora = Date.now();
    return [
      { id: 'ejemplo-yogur', food: 'yogur', ph: 3.0, ts: ahora - 2 * 60 * 60 * 1000, estado: 'out', motivo: 'Ejemplo ficticio para mostrar una lectura fuera del rango esperado.', demo: true, ejemplo: true },
      { id: 'ejemplo-leche', food: 'leche', ph: 6.7, ts: ahora - 26 * 60 * 60 * 1000, estado: 'in', motivo: 'Ejemplo ficticio para mostrar una lectura dentro del rango esperado.', demo: true, ejemplo: true },
      { id: 'ejemplo-queso', food: 'queso', ph: 5.3, ts: ahora - 50 * 60 * 60 * 1000, estado: 'in', motivo: 'Ejemplo ficticio para mostrar una lectura dentro del rango esperado.', demo: true, ejemplo: true }
    ];
  };
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw === null) {
      S.registros = ejemplosIniciales();
      localStorage.setItem(LS_KEY, JSON.stringify(S.registros));
      return;
    }
    const datos = JSON.parse(raw);
    S.registros = Array.isArray(datos) ? datos.filter(r => r && r.id && MeepCore.ALIMENTOS[r.food]) : [];
  } catch (e) {
    S.registros = ejemplosIniciales();
  }
}
function guardarLS() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(S.registros));
    return true;
  } catch (e) {
    toast('No se pudo guardar el historial en este navegador.');
    return false;
  }
}

const fechaHora = ts => new Date(ts).toLocaleString('es-CL', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const tab = () => ['home', 'food', 'measure', 'result'].includes(S.view) ? 'medir' : (['history', 'detail'].includes(S.view) ? 'historial' : 'ayuda');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let timer = null, toastTimer = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------- Vistas ---------- */
function vHome() {
  const c = S.conexion;
  const est = {
    off: `<span class="estado off"><span class="dot"></span>Sin conexión Bluetooth</span>`,
    connecting: `<span class="estado wait"><span class="spinner" style="width:14px;height:14px;border-width:2px"></span>Buscando dispositivo MEEP…</span>`,
    error: `<span class="estado err">${ic('warn', 18)}No se encontró MEEP</span>`,
    demo: `<span class="estado on">${ic('check', 18)}Conectado · modo demostración</span>`
  }[c];
  let acciones = '';
  if (c === 'off') acciones = `<button class="btn secundario" data-a="conectar">${ic('bt', 22)}Conectar MEEP</button>`;
  if (c === 'connecting') acciones = `<button class="btn secundario" disabled>${ic('bt', 22)}Conectando…</button>`;
  if (c === 'error') acciones = `
    <div class="nota">${ic('info', 20)}<div>No se pudo establecer la conexión Bluetooth. Este prototipo todavía no incluye la comunicación con el dispositivo real.</div></div>
    <button class="btn secundario" data-a="conectar">${ic('bt', 22)}Reintentar</button>
    <button class="btn borde" data-a="demo">Usar modo demostración</button>`;
  if (c === 'demo') acciones = `
    <div class="nota">${ic('flask', 20)}<div><b>Modo demostración.</b> Las lecturas que verás son ficticias y no provienen de un dispositivo MEEP real.</div></div>
    <button class="btn borde chico" data-a="desconectar">Desconectar</button>`;
  return `
  <div class="stack">
    <div class="hero-home">
      <span class="tag">Primera etapa · Lácteos</span>
      <h1>Conoce el pH de tus alimentos</h1>
      <p class="muted">Mide una pequeña muestra con tu dispositivo MEEP y recibe una lectura clara en tu teléfono.</p>
    </div>
    <div class="card pad-lg stack">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Dispositivo</h3>${est}</div>
      ${acciones}
    </div>
    <button class="btn primario" data-a="ir-food">${ic('sonda', 24)}Comenzar medición</button>
    <div class="nota sutil">${ic('info', 20)}<div>MEEP detecta alteraciones del pH. No certifica la inocuidad de un alimento.</div></div>
  </div>`;
}

function vFood() {
  const cards = Object.entries(MeepCore.ALIMENTOS).map(([k, a]) => `
    <button class="food" data-a="elegir" data-k="${k}" aria-pressed="${S.food === k}">
      <span class="badge-sel">${ic('check', 16)}</span>
      <span class="ico">${ic(a.icono, 30)}</span>
      <b>${a.nombre}</b>
      ${a.rango ? `<span class="mini">Ref. provisional</span>` : `<span class="mini amb">Rango por validar</span>`}
    </button>`).join('');
  return `
  <div class="stack">
    <div><h2>¿Qué alimento vas a medir?</h2><p class="muted small">Toca una tarjeta para seleccionarla.</p></div>
    <div class="grid2">${cards}</div>
    <div class="nota">${ic('info', 20)}<div>Los rangos de referencia son <b>provisionales y de demostración</b>: aún no están validados experimentalmente. Los alimentos sin rango no se pueden interpretar.</div></div>
    <button class="btn primario" data-a="ir-measure" ${S.food ? '' : 'disabled'}>Continuar${ic('chev', 20)}</button>
  </div>`;
}

function vMeasure() {
  const a = MeepCore.ALIMENTOS[S.food];
  const demo = S.conexion === 'demo';
  const escen = [['in', 'check', 'Dentro del rango'], ['out', 'warn', 'Fuera del rango'], ['na', 'help', 'No interpretable']]
    .map(([k, i, t]) => `<button data-a="escenario" data-k="${k}" aria-pressed="${S.escenario === k}">${ic(i, 16)}${t}</button>`).join('');
  const cabecera = `<div class="card" style="display:flex;align-items:center;gap:14px">
      <span class="food" style="min-height:0;width:56px;height:56px;padding:0;border-radius:16px;border:0;background:var(--fondo)"><span class="ico" style="background:none">${ic(a.icono, 30)}</span></span>
      <div style="flex:1;min-width:0"><span class="muted small">Alimento seleccionado</span><br><b style="font-family:var(--display);font-size:18px">${a.nombre}</b></div>
      <button class="link small" data-a="ir-food">Cambiar</button></div>`;

  if (S.fase === 'reading') return `
    <div class="stack">${cabecera}
      <div class="lectura"><div class="ondas"><i></i><i></i><i></i><span class="centro">${ic('sonda', 40)}</span></div></div>
      <div style="text-align:center"><h2>Esperando lectura del dispositivo</h2><p class="muted small" style="margin-top:6px">Mantén la sonda en contacto con la muestra.</p></div>
      ${demo ? `<div class="nota">${ic('flask', 20)}<div>Lectura ficticia de demostración.</div></div>` : ''}
      <button class="btn borde" data-a="cancelar">Cancelar</button></div>`;

  if (S.fase === 'error') return `
    <div class="stack">${cabecera}
      <div class="card" style="border-color:var(--rojo);background:var(--rojo-tint)"><div style="display:flex;gap:12px;align-items:flex-start;color:var(--rojo)">${ic('warn', 28)}<div style="color:var(--texto)"><h3>No se pudo realizar la medición</h3><p class="small" style="margin-top:6px">${esc(S.errorMedicion)}</p></div></div></div>
      <button class="btn primario" data-a="medir">Reintentar</button>
      ${S.conexion !== 'demo' ? `<button class="btn secundario" data-a="ir-home">${ic('bt', 22)}Ir a conectar MEEP</button>` : ''}
    </div>`;

  return `
    <div class="stack">${cabecera}
      <div class="lectura"><div class="ondas"><span class="centro">${ic('sonda', 40)}</span></div></div>
      <p style="text-align:center" class="muted">Coloca la sonda en la muestra y pulsa el botón.</p>
      ${demo ? `<div class="card stack"><div><h3>Resultado de demostración</h3><p class="muted small">Elige qué resultado ficticio quieres ver.</p></div><div class="escenarios">${escen}</div></div>` : ''}
      <button class="btn primario" data-a="medir">${ic('sonda', 24)}Realizar medición</button>
    </div>`;
}

function vResult() {
  const r = S.resultado, a = MeepCore.ALIMENTOS[r.food];
  const rango = MeepCore.fmtRango(a.rango);
  const motivo = r.estado === 'na' ? (r.motivo || 'No se conoce el motivo.') : ESTADO_EXPL[r.estado];
  return `
  <div class="stack">
    <section class="res-hero ${r.estado}" aria-live="polite">
      <span class="icono">${ic(ESTADO_ICON[r.estado], 38)}</span>
      <span class="estado-txt">${ESTADO_TXT[r.estado]}</span>
      <span class="ph-val">${r.ph === null ? '—' : MeepCore.fmt(r.ph)}<small>pH</small></span>
      <span class="alimento">${a.nombre}</span>
      <p class="expl">${esc(motivo)}</p>
    </section>
    ${r.demo ? `<div class="nota">${ic('flask', 20)}<div><b>Lectura ficticia de demostración.</b> No proviene de un dispositivo MEEP real.</div></div>` : ''}
    <div class="card filas">
      <div class="fila"><span>Alimento</span><span>${a.nombre}</span></div>
      <div class="fila"><span>Rango de referencia</span><span>${rango ? rango + (a.validado ? '' : '<br><span class="mini amb" style="font-weight:700">Provisional, no validado</span>') : 'No definido'}</span></div>
      <div class="fila"><span>Interpretación</span><span>${ESTADO_CORTO[r.estado]}</span></div>
      <div class="fila"><span>Fecha y hora</span><span>${fechaHora(r.ts)}</span></div>
    </div>
    <div class="nota sutil">${ic('info', 20)}<div>${NOTA_PH}</div></div>
    <div class="fila-botones">
      ${r.estado === 'na' ? `<button class="btn primario" data-a="medir">Reintentar</button>` : ''}
      <button class="btn secundario" data-a="guardar" ${S.guardado ? 'disabled' : ''}>${S.guardado ? ic('check', 22) + 'Medición guardada' : 'Guardar medición'}</button>
      <button class="btn borde" data-a="nueva">Nueva medición</button>
      ${S.guardado ? `<button class="link" data-a="ir-history">Ver historial</button>` : ''}
    </div>
  </div>`;
}

function vHistory() {
  if (!S.registros.length) return `
    <div class="vacio"><span class="circ">${ic('clock', 40)}</span><h2>Aún no tienes mediciones guardadas</h2>
    <p class="muted">Cuando guardes una medición aparecerá aquí.</p>
    <button class="btn primario" data-a="ir-food">Hacer la primera medición</button></div>`;
  const orden = [...S.registros].sort((x, y) => y.ts - x.ts);
  const hayEj = S.registros.some(r => r.ejemplo);
  return `
  <div class="stack">
    <h2>Historial</h2>
    ${hayEj ? `<div class="nota">${ic('flask', 20)}<div>Los registros marcados como <b>Ejemplo ficticio</b> son datos de demostración, no mediciones reales.</div></div>` : ''}
    ${orden.map(r => `
      <button class="item ${r.estado}" data-a="detalle" data-id="${r.id}">
        <span class="barra"></span>
        <span class="cuerpo">
          <b>${MeepCore.ALIMENTOS[r.food].nombre}</b>
          <span class="muted small">${fechaHora(r.ts)}</span>
          <span class="pill ${r.estado}">${ic(ESTADO_ICON[r.estado], 16)}${ESTADO_CORTO[r.estado]}</span>
          ${r.ejemplo ? `<span class="mini amb" style="align-self:flex-start">Ejemplo ficticio</span>` : (r.demo ? `<span class="mini" style="align-self:flex-start">Demostración</span>` : '')}
        </span>
        <span class="ph">${r.ph === null ? '—' : MeepCore.fmt(r.ph)}</span>
        ${ic('chev', 20, 'style="color:var(--muted)"')}
      </button>`).join('')}
    ${hayEj ? `<button class="btn borde chico" data-a="quitar-ej">Quitar ejemplos de demostración</button>` : ''}
  </div>`;
}

function vDetail() {
  const r = S.registros.find(x => x.id === S.detalleId);
  if (!r) return vHistory();
  const a = MeepCore.ALIMENTOS[r.food];
  const rango = MeepCore.fmtRango(a.rango);
  const motivo = r.estado === 'na' ? (r.motivo || 'No se conoce el motivo.') : ESTADO_EXPL[r.estado];
  return `
  <div class="stack">
    <section class="res-hero ${r.estado}">
      <span class="icono">${ic(ESTADO_ICON[r.estado], 38)}</span>
      <span class="estado-txt">${ESTADO_TXT[r.estado]}</span>
      <span class="ph-val">${r.ph === null ? '—' : MeepCore.fmt(r.ph)}<small>pH</small></span>
      <span class="alimento">${a.nombre}</span>
      <p class="expl">${esc(motivo)}</p>
    </section>
    ${r.demo ? `<div class="nota">${ic('flask', 20)}<div><b>${r.ejemplo ? 'Ejemplo ficticio.' : 'Lectura de demostración.'}</b> No proviene de un dispositivo MEEP real.</div></div>` : ''}
    <div class="card filas">
      <div class="fila"><span>Alimento</span><span>${a.nombre}</span></div>
      <div class="fila"><span>Rango de referencia</span><span>${rango ? rango + '<br><span class="mini amb" style="font-weight:700">Provisional, no validado</span>' : 'No definido'}</span></div>
      <div class="fila"><span>Interpretación</span><span>${ESTADO_CORTO[r.estado]}</span></div>
      <div class="fila"><span>Fecha y hora</span><span>${fechaHora(r.ts)}</span></div>
    </div>
    <div class="nota sutil">${ic('info', 20)}<div>${NOTA_PH}</div></div>
    <button class="btn borde" data-a="borrar" data-id="${r.id}">${ic('trash', 22)}Eliminar registro</button>
  </div>`;
}

function vHelp() {
  const sec = (icon, t, body) => `<details><summary><span class="ico">${ic(icon, 20)}</span>${t}<span class="chev">${ic('chev', 20)}</span></summary><div class="det-body">${body}</div></details>`;
  const pasos = l => `<ol class="pasos">${l.map(x => `<li><span>${x}</span></li>`).join('')}</ol>`;
  return `
  <div class="stack">
    <h2>Ayuda</h2>
    <button class="btn primario" data-a="ir-food">${ic('sonda', 24)}Ir a medir</button>
    ${sec('bt', 'Cómo conectar MEEP', pasos(['Enciende tu dispositivo MEEP.', 'Activa el Bluetooth del teléfono.', 'En Medir, pulsa “Conectar MEEP”.', 'Espera a ver el estado “Conectado”.']))}
    ${sec('list', 'Cómo seleccionar un alimento', pasos(['Pulsa “Comenzar medición”.', 'Toca la tarjeta del alimento que vas a medir.', 'Pulsa “Continuar”.']))}
    ${sec('sonda', 'Cómo realizar una medición', pasos(['Coloca una pequeña muestra del alimento.', 'Introduce la sonda en la muestra.', 'Pulsa “Realizar medición”.', 'Espera el resultado en pantalla. El LED del dispositivo también indica verde o rojo.']))}
    ${sec('broom', 'Cómo limpiar y cuidar la sonda', pasos(['Enjuágala con agua limpia después de cada uso.', 'Sécala con un paño limpio.', 'No la raspes ni uses objetos duros.', 'Guárdala limpia y seca, según las indicaciones del fabricante.']))}
    ${sec('check', 'Qué significa cada resultado', `<div class="leyenda">
      <div><span style="color:var(--verde)">${ic('check', 24)}</span><span><b style="color:var(--verde)">Dentro del rango esperado.</b> La lectura coincide con el rango de referencia del alimento.</span></div>
      <div><span style="color:var(--rojo)">${ic('warn', 24)}</span><span><b style="color:var(--rojo)">Fuera del rango esperado.</b> Revisa la conservación y sigue los procedimientos de seguridad alimentaria.</span></div>
      <div><span style="color:var(--muted)">${ic('help', 24)}</span><span><b>No interpretable.</b> La lectura falló o el alimento no tiene rango definido. Intenta de nuevo.</span></div></div>`)}
    ${sec('plug', 'Qué hacer si falla la conexión', pasos(['Comprueba que MEEP esté encendido y cargado.', 'Verifica que el Bluetooth del teléfono esté activo.', 'Acerca el teléfono al dispositivo.', 'Vuelve a pulsar “Conectar MEEP”.']))}
    ${sec('info', 'Limitaciones de la medición de pH', `<p>El pH sirve para detectar alteraciones, pero <b>no garantiza</b> que un alimento esté libre de microorganismos patógenos o toxinas. Mantén siempre las prácticas de higiene y conservación.</p>
      <p style="margin-top:10px">Los rangos de referencia de esta versión son provisionales y aún no están validados experimentalmente.</p>`)}
    <button class="btn borde" data-a="ir-food">Volver a medir</button>
  </div>`;
}

/* ---------- Render ---------- */
function render() {
  const v = S.view, tb = document.getElementById('topbar');
  const titulos = { food: 'Selecciona el alimento', measure: 'Medición de pH', result: 'Resultado', detail: 'Detalle de la medición' };
  const atras = { food: 'home', measure: 'food', result: 'measure', detail: 'history' }[v];
  if (atras) tb.innerHTML = `<button class="back" data-a="atras" aria-label="Volver">${ic('back', 22)}</button><span class="titulo">${titulos[v]}</span>${S.conexion === 'demo' ? '<span class="chip-demo">Demo</span>' : ''}`;
  else tb.innerHTML = `<span class="logo">${logoSvg()}<span><b>MEEP</b><span class="sub">${v === 'history' ? 'Historial' : v === 'help' ? 'Ayuda' : 'Medidor de pH de alimentos'}</span></span></span>${S.conexion === 'demo' ? '<span class="chip-demo">Demo</span>' : ''}`;

  const vistas = { home: vHome, food: vFood, measure: vMeasure, result: vResult, history: vHistory, detail: vDetail, help: vHelp };
  const main = document.getElementById('main');
  const keep = main.scrollTop;
  main.innerHTML = vistas[v]();
  main.scrollTop = (main.dataset.v === v) ? keep : 0;
  main.dataset.v = v;

  const t = tab();
  document.getElementById('nav').innerHTML = [['medir', 'Medir', 'sonda'], ['historial', 'Historial', 'clock'], ['ayuda', 'Ayuda', 'help']]
    .map(([k, n, i]) => `<button data-a="tab" data-k="${k}" ${t === k ? 'aria-current="page"' : ''}>${ic(i, 24)}${n}</button>`).join('');
}
function go(v) { clearTimeout(timer); if (v !== 'measure') S.fase = 'idle'; S.view = v; render(); }

/* ---------- Lógica de medición (usa el núcleo) ---------- */
let dispositivo = null;
async function conectar() {
  S.conexion = 'connecting'; render();
  clearTimeout(timer);
  timer = setTimeout(async () => {
    // Hoy el adaptador Bluetooth real lanza error a propósito: aún no existe el protocolo de MEEP.
    // Cuando se implemente, aquí se asignará dispositivo = MeepCore.BluetoothDevice y se mostrará el estado conectado real.
    try { await MeepCore.BluetoothDevice.connect(); S.conexion = 'off'; }
    catch (e) { S.conexion = 'error'; }
    if (S.view === 'home') render();
  }, 1400);
}
async function medir() {
  if (S.conexion !== 'demo' || !dispositivo) {
    S.fase = 'error'; S.errorMedicion = 'MEEP no está conectado. Conecta el dispositivo o usa el modo demostración e intenta de nuevo.';
    S.view = 'measure'; render(); return;
  }
  S.fase = 'reading'; S.view = 'measure'; render();
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      const lec = await dispositivo.read(S.food, { escenario: S.escenario });
      const it = MeepCore.interpretar(S.food, lec.ph);
      S.resultado = { id: 'm' + Date.now(), food: S.food, ph: lec.ph, ts: Date.now(), estado: it.estado, motivo: lec.motivo || it.motivo, demo: dispositivo.demo };
      // Cada resultado se agrega automáticamente al historial local.
      S.registros.push({ ...S.resultado });
      S.guardado = guardarLS();
      S.fase = 'idle'; S.view = 'result';
    } catch (e) {
      S.fase = 'error'; S.errorMedicion = 'No se pudo leer el dispositivo. Revisa la conexión e intenta de nuevo.';
    }
    render();
  }, 2600);
}

/* ---------- Eventos ---------- */
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a;
  switch (a) {
    case 'tab': go({ medir: 'home', historial: 'history', ayuda: 'help' }[el.dataset.k]); break;
    case 'atras': go({ food: 'home', measure: 'food', result: 'measure', detail: 'history' }[S.view]); break;
    case 'conectar': conectar(); break;
    case 'demo': dispositivo = MeepCore.DemoDevice; S.conexion = 'demo'; render(); toast('Modo demostración activado'); break;
    case 'desconectar': dispositivo = null; S.conexion = 'off'; render(); break;
    case 'ir-food': go('food'); break;
    case 'ir-home': go('home'); break;
    case 'ir-history': go('history'); break;
    case 'ir-measure': if (S.food) go('measure'); break;
    case 'elegir': S.food = el.dataset.k; render(); break;
    case 'escenario': S.escenario = el.dataset.k; render(); break;
    case 'medir': medir(); break;
    case 'cancelar': clearTimeout(timer); S.fase = 'idle'; render(); break;
    case 'nueva': S.fase = 'idle'; go('measure'); break;
    case 'guardar':
      if (S.resultado && !S.registros.some(r => r.id === S.resultado.id)) {
        S.registros.push({ ...S.resultado });
      }
      if (S.resultado) {
        S.guardado = guardarLS(); render();
        if (S.guardado) toast('Medición guardada en el historial');
      }
      break;
    case 'detalle': S.detalleId = el.dataset.id; go('detail'); break;
    case 'borrar': S.registros = S.registros.filter(r => r.id !== el.dataset.id); guardarLS(); go('history'); toast('Registro eliminado'); break;
    case 'quitar-ej': S.registros = S.registros.filter(r => !r.ejemplo); guardarLS(); render(); break;
  }
});

cargar();
render();

</script>
